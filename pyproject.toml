[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.1.0"
description = "RAG-агент с памятью, трассировкой и стендом оценки качества"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tiktoken>=0.7",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


